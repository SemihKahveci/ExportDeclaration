services:
  mongo:
    image: mongo:8.0
    container_name: export-declaration-mongo
    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - export_network

  redis:
    image: redis:7-alpine
    container_name: export-declaration-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - export_network

  backend:
    image: export-declaration-backend:${APP_VERSION}
    container_name: export-declaration-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      MONGODB_URI: mongodb://mongo:27017/export_declaration
      REDIS_URL: redis://redis:6379

      UPLOAD_DIR: /app/uploads
      JSON_BODY_LIMIT: 20mb

      CORS_ORIGIN: http://localhost:5173

      INVOICE_PARSER_ENABLED: "true"
      INVOICE_PARSER_PYTHON: /opt/venv/bin/python
      INVOICE_PARSER_DIR: /app/backend/scripts/invoice_parser
      INVOICE_PARSER_TIMEOUT_MS: 600000
  
      MAIL_ENABLED: ${MAIL_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      NEW_USER_NOTIFY_EMAIL: ${NEW_USER_NOTIFY_EMAIL:-serdarkahveci88@gmail.com}

      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME}
      INSTALLATION_COMPANY_ID: ${INSTALLATION_COMPANY_ID:-}
      SUPERADMIN_RESET_PASSWORD: ${SUPERADMIN_RESET_PASSWORD:-false}

      # Şimdilik lisanslama kapalı.
      LICENSE_ENABLED: "false"

    ports:
      - "3000:3000"

    volumes:
      - ./data/uploads:/app/uploads

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - export_network

  idp-worker:
    image: export-declaration-backend:${APP_VERSION}
    container_name: export-declaration-idp-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/export_declaration
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      IDP_WORKER_CONCURRENCY: ${IDP_WORKER_CONCURRENCY:-2}
      IDP_JOB_ATTEMPTS: ${IDP_JOB_ATTEMPTS:-3}
      IDP_JOB_BACKOFF_MS: ${IDP_JOB_BACKOFF_MS:-5000}
      IDP_PROCESSOR_VERSION: ${IDP_PROCESSOR_VERSION:-foundation-4.1}
      INVOICE_PARSER_ENABLED: "true"
      INVOICE_PARSER_PYTHON: /opt/venv/bin/python
      INVOICE_PARSER_DIR: /app/backend/scripts/invoice_parser
      INVOICE_PARSER_TIMEOUT_MS: ${INVOICE_PARSER_TIMEOUT_MS:-600000}
      OCR_IDLE_TIMEOUT_MS: ${OCR_IDLE_TIMEOUT_MS:-120000}
      OCR_TOTAL_TIMEOUT_MS: ${OCR_TOTAL_TIMEOUT_MS:-900000}
      OCR_BATCH_SIZE: ${OCR_BATCH_SIZE:-10}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-2}
      OCR_MAX_RENDER_DIMENSION: ${OCR_MAX_RENDER_DIMENSION:-2400}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - export_network

  frontend:
    image: export-declaration-frontend:${APP_VERSION}
    container_name: export-declaration-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - export_network

volumes:
  mongo_data:
  redis_data:

networks:
  export_network:
    driver: bridge
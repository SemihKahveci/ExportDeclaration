services:
  mongo:
    image: mongo:8.0
    container_name: export-declaration-mongo-dev
    restart: unless-stopped

    volumes:
      - mongo_dev_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - export_dev_network

  redis:
    image: redis:7.4-alpine
    container_name: export-declaration-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - export_dev_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev

    container_name: export-declaration-backend-dev
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3000

      MONGODB_URI: mongodb://mongo:27017/export_declaration
      REDIS_URL: redis://redis:6379
      
      LICENSE_ENABLED: "false"
      LICENSE_FILE_PATH: /app/licenses/license.json
      LICENSE_PUBLIC_KEY_PATH: /app/backend/license/public-key.pem
      INSTALLATION_ID_PATH: /app/license-data/installation-id.txt

      UPLOAD_DIR: /app/uploads
      JSON_BODY_LIMIT: 20mb
      CORS_ORIGIN: http://localhost:5173

      INVOICE_PARSER_ENABLED: "true"
      INVOICE_PARSER_PYTHON: /opt/venv/bin/python
      INVOICE_PARSER_DIR: /app/backend/scripts/invoice_parser
      INVOICE_PARSER_TIMEOUT_MS: 600000

      MAIL_ENABLED: ${MAIL_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      NEW_USER_NOTIFY_EMAIL: ${NEW_USER_NOTIFY_EMAIL:-serdarkahveci88@gmail.com}

      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME}
      INSTALLATION_COMPANY_ID: ${INSTALLATION_COMPANY_ID:-}
      SUPERADMIN_RESET_PASSWORD: ${SUPERADMIN_RESET_PASSWORD:-false}

      # Foundation 8 local/OpenAI-compatible Qwen runtime (explicit opt-in).
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app/backend
      - ./tsconfig.json:/app/tsconfig.json
      - ./uploads:/app/uploads
      - ./licenses:/app/licenses:ro
      - ./license-data:/app/license-data:ro
      - backend_node_modules:/app/node_modules

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - export_dev_network

  idp-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    container_name: export-declaration-idp-worker-dev
    restart: unless-stopped
    command: ["npm", "run", "dev:worker"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/export_declaration
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      IDP_WORKER_CONCURRENCY: ${IDP_WORKER_CONCURRENCY:-2}
      IDP_JOB_ATTEMPTS: ${IDP_JOB_ATTEMPTS:-3}
      IDP_JOB_BACKOFF_MS: ${IDP_JOB_BACKOFF_MS:-5000}
      IDP_PROCESSOR_VERSION: ${IDP_PROCESSOR_VERSION:-foundation-1}
      INVOICE_PARSER_ENABLED: "true"
      INVOICE_PARSER_PYTHON: /opt/venv/bin/python
      INVOICE_PARSER_DIR: /app/backend/scripts/invoice_parser
      INVOICE_PARSER_TIMEOUT_MS: 600000
      # Worker must receive the same Qwen runtime configuration as backend.
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen3}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
    volumes:
      - ./backend:/app/backend
      - ./tsconfig.json:/app/tsconfig.json
      - ./uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - export_dev_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev

    container_name: export-declaration-frontend-dev
    restart: unless-stopped

    environment:
      # Uygulama appEnv.ts içinde VITE_API_BASE okur (VITE_API_BASE_URL değil).
      # Tarayıcı host üzerinden backend'e gider (3000 portu publish edilmiş).
      VITE_API_BASE: http://localhost:3000
      # VITE_API_BASE boşsa Vite proxy bu hedefe yönlenir (container ağı).
      VITE_DEV_PROXY_TARGET: http://backend:3000
      
      # Windows'ta localhost → ::1 (IPv6) çözülebilir; API 127.0.0.1'de dinler.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    networks:
      - export_dev_network

volumes:
  mongo_dev_data:
  redis_dev_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  export_dev_network:
    driver: bridge